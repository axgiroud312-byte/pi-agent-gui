name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Real Pi 0.87.0 protocol smoke (no model credentials)
        run: npm run test:contract
      - run: npm run build
      - name: Electron GUI to RPC boundary E2E
        run: npm run test:e2e
      - name: Build Windows NSIS installer
        run: npm run package:win
      - name: Upload screenshots, traces, reports, and protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn
          retention-days: 14
