name: Windows native checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
      RAYON_NUM_THREADS: '2'
      # Local Windows assets only; cross-platform remote assets are separate acceptance.
      ZCODE_SKIP_REMOTE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify committed source and notice bytes (before install)
        run: node scripts/check-native-provenance.mjs
      - name: Provenance regression tests (Node only)
        if: ${{ !cancelled() }}
        run: node --test scripts/test/native-provenance.test.mjs
      - name: Install the native workspace from its frozen lockfile
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      # Explicit conditions collect independent failures without turning any into success.
      # Do not add continue-on-error or fall back to the retired prototype scripts.
      - name: Full native lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint
      - name: Full native typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck
      - name: Native architecture check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run architecture:check
      - name: Imported native service and UI tests (four test files)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --import tsx --test --test-concurrency=1 "packages/services/test/*.test.ts" "packages/ui/test/*.test.ts"
      - name: Installed dependency licenses and committed notice freshness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/licenses.mjs check
      - name: Prepare local Windows runtime assets
        id: runtime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run prepare:desktop-runtime
      # The upstream build:no-runtime-assets runs tsup and Vite in parallel.
      # Use its actual tools sequentially to bound peak Windows runner memory.
      - name: Prepare desktop build metadata
        id: metadata
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: pnpm --filter @zcode/desktop run prepare:build-meta
      - name: Clean desktop production output
        id: clean
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: node --input-type=module -e "import {cleanDesktopProductionOutput,resolveDesktopBuildCwd} from './packages/desktop/scripts/run-production-build.mjs'; await cleanDesktopProductionOutput({cwd:resolveDesktopBuildCwd()});"
      - name: Build desktop main, host, scheduler and preload
        id: host
        if: ${{ !cancelled() && steps.clean.outcome == 'success' }}
        env:
          NODE_ENV: production
        run: pnpm --dir packages/desktop exec tsup
      - name: Build desktop renderer
        id: renderer
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        env:
          NODE_ENV: production
        run: pnpm --dir packages/desktop exec vite build
      - name: Actual default product desktop smoke
        if: ${{ !cancelled() && steps.renderer.outcome == 'success' }}
        run: node scripts/native-desktop-smoke.mjs
      - name: Upload native desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-parity-${{ github.sha }}
          path: |
            test-results/native-parity/**
          if-no-files-found: warn
          retention-days: 14
